services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bahia
      POSTGRES_PASSWORD: bahia
      POSTGRES_DB: bahia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahia"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bahia:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION_BASE: ${VERSION_BASE:-0.1.0}
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        VERSION: ${VERSION:-}
    ports:
      - "8080:8080"
    command: ["--config", "/etc/bahia/config.yaml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.compose.yaml:/etc/bahia/config.yaml:ro
    environment:
      BAHIA_DB_HOST: postgres
      BAHIA_DB_PORT: "5432"
      BAHIA_DB_USER: bahia
      BAHIA_DB_PASSWORD: bahia
      BAHIA_DB_NAME: bahia
      BAHIA_DB_SSLMODE: disable
      BAHIA_SERVER_HOST: "0.0.0.0"
      BAHIA_SERVER_PORT: "8080"
      BAHIA_LOG_LEVEL: info
      BAHIA_LOG_FORMAT: json
      BAHIA_NOSTR_PRIVATE_KEY: ${BAHIA_NOSTR_PRIVATE_KEY:?BAHIA_NOSTR_PRIVATE_KEY is required}
      BAHIA_NOSTR_AUTHORIZED_PUBKEYS: ${BAHIA_NOSTR_AUTHORIZED_PUBKEYS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Container health is liveness-only so a Signet outage does not restart Bahia.
    # Traffic gates and operators should use http://bahia:8080/ready.
    labels:
      io.bahia.health.liveness: "http://localhost:8080/health"
      io.bahia.health.readiness: "http://localhost:8080/ready"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  relay:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION_BASE: ${VERSION_BASE:-0.1.0}
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        VERSION: ${VERSION:-}
    entrypoint: ["bahia-relay"]
    command: ["--config", "/etc/bahia/config.yaml"]
    ports:
      - "3334:3334"
    volumes:
      - relaydata:/var/lib/bahia/relay-sidecar
      - ./config.compose.yaml:/etc/bahia/config.yaml:ro
    environment:
      BAHIA_LOG_LEVEL: info
      BAHIA_LOG_FORMAT: json
      BAHIA_NOSTR_PRIVATE_KEY: ${BAHIA_NOSTR_PRIVATE_KEY:?BAHIA_NOSTR_PRIVATE_KEY is required}
      BAHIA_NOSTR_AUTHORIZED_PUBKEYS: ${BAHIA_NOSTR_AUTHORIZED_PUBKEYS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header='Accept: application/nostr+json' -O /dev/null http://localhost:3334/relay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        PUBLIC_BAHIA_BOOTSTRAP_RELAYS: ${PUBLIC_BAHIA_BOOTSTRAP_RELAYS:-ws://localhost:3334/relay}
        PUBLIC_BAHIA_SERVICE_PUBKEYS: ${PUBLIC_BAHIA_SERVICE_PUBKEYS:-}
        PUBLIC_BAHIA_WEB_BASE_VERSION: ${VERSION_BASE:-0.1.0}
        PUBLIC_BAHIA_GIT_COMMIT: ${GIT_COMMIT:-dev}
        PUBLIC_BAHIA_WEB_VERSION: ${WEB_VERSION:-}
    ports:
      - "3000:80"
    depends_on:
      bahia:
        condition: service_healthy
      relay:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  relaydata:
