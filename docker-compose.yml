services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bahia
      POSTGRES_PASSWORD: bahia
      POSTGRES_DB: bahia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahia"]
      interval: 5s
      timeout: 5s
      retries: 5

  bahia:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BAHIA_DB_HOST: postgres
      BAHIA_DB_PORT: "5432"
      BAHIA_DB_USER: bahia
      BAHIA_DB_PASSWORD: bahia
      BAHIA_DB_NAME: bahia
      BAHIA_DB_SSLMODE: disable
      BAHIA_SERVER_HOST: "0.0.0.0"
      BAHIA_SERVER_PORT: "8080"
      BAHIA_LOG_LEVEL: info
      BAHIA_LOG_FORMAT: json
      BAHIA_RECONCILE_ENABLED: "true"
      BAHIA_RECONCILE_INTERVAL: "60s"
      BAHIA_NOSTR__SIDECAR__ENABLED: "true"
      BAHIA_NOSTR__SIDECAR__PUBLIC_URL: "ws://localhost:3000/relay"
      BAHIA_NOSTR__SIDECAR__BACKEND_URL: "ws://relay:3334/relay"
      BAHIA_NOSTR__SIDECAR__LISTEN_ADDR: "0.0.0.0:3334"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["bahia-relay"]
    ports:
      - "3334:3334"
    volumes:
      - relaydata:/var/lib/bahia/relay-sidecar
    environment:
      BAHIA_LOG_LEVEL: info
      BAHIA_LOG_FORMAT: json
      BAHIA_NOSTR__SIDECAR__ENABLED: "true"
      BAHIA_NOSTR__SIDECAR__LISTEN_ADDR: "0.0.0.0:3334"
      BAHIA_NOSTR__SIDECAR__PUBLIC_URL: "ws://localhost:3000/relay"
      BAHIA_NOSTR__SIDECAR__BACKEND_URL: "ws://relay:3334/relay"
      BAHIA_NOSTR__SIDECAR__DATA_DIR: "/var/lib/bahia/relay-sidecar"
      BAHIA_NOSTR__SIDECAR__MAX_QUERY_LIMIT: "500"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header='Accept: application/nostr+json' -O /dev/null http://localhost:3334/relay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        PUBLIC_BAHIA_BOOTSTRAP_RELAYS: ${PUBLIC_BAHIA_BOOTSTRAP_RELAYS:-ws://localhost:3334/relay}
        PUBLIC_BAHIA_SERVICE_PUBKEYS: ${PUBLIC_BAHIA_SERVICE_PUBKEYS:-}
    ports:
      - "3000:80"
    depends_on:
      bahia:
        condition: service_healthy
      relay:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  relaydata:
