services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bahia
      POSTGRES_PASSWORD: bahia
      POSTGRES_DB: bahia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahia"]
      interval: 5s
      timeout: 5s
      retries: 5

  bahia:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      BAHIA_DB_HOST: postgres
      BAHIA_DB_PORT: "5432"
      BAHIA_DB_USER: bahia
      BAHIA_DB_PASSWORD: bahia
      BAHIA_DB_NAME: bahia
      BAHIA_DB_SSLMODE: disable
      BAHIA_SERVER_HOST: "0.0.0.0"
      BAHIA_SERVER_PORT: "8080"
      BAHIA_LOG_LEVEL: info
      BAHIA_LOG_FORMAT: json
      BAHIA_RECONCILE_ENABLED: "true"
      BAHIA_RECONCILE_INTERVAL: "60s"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
