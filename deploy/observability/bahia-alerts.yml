groups:
  - name: bahia-ws6
    rules:
      - alert: BahiaWorkerHeartbeatStale
        expr: bahia_worker_heartbeat_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker {{ $labels.worker }} heartbeat is stale"
          runbook_url: "/docs/runbooks/ws6-alerts.md#bahiaworkerheartbeatstale"
      - alert: BahiaWorkerDown
        expr: bahia_worker_heartbeat_lag_seconds > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Worker {{ $labels.worker }} is presumed down"
          runbook_url: "/docs/runbooks/ws6-alerts.md#bahiaworkerdown"
      - alert: BahiaDriftStuck
        expr: bahia_fleet_health_drift_stuck > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "One or more Bahia service states have stuck drift"
          runbook_url: "/docs/runbooks/ws6-alerts.md#bahiadriftstuck"
      - alert: BahiaWorkerResourcePressure
        expr: bahia_worker_pressure_recommendations{action="operator_intervention"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Worker disk, VRAM, memory, or thermal pressure needs intervention"
          runbook_url: "/docs/runbooks/ws6-alerts.md#bahiaworkerresourcepressure"
      - alert: BahiaRelayDegraded
        expr: (bahia_nostr_relays_degraded_total + bahia_nostr_relays_unhealthy_total) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Bahia relay connectivity is degraded"
          runbook_url: "/docs/runbooks/ws6-alerts.md#bahiarelaydegraded"
      - alert: BahiaAudit4903Anomaly
        expr: increase(bahia_audit_4903_anomalies_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Bahia detected an invalid or contradictory kind-4903 audit event"
          runbook_url: "/docs/runbooks/ws6-alerts.md#bahiaaudit4903anomaly"
      - alert: BahiaAuthorizationRejectionSpike
        expr: sum(increase(bahia_authorization_rejections_total[5m])) > 10
        labels:
          severity: warning
        annotations:
          summary: "Bahia authorization rejection rate has spiked"
          runbook_url: "/docs/runbooks/ws6-alerts.md#bahiaauthorizationrejectionspike"
      - alert: BahiaTierRejectionSpike
        expr: sum(increase(bahia_tier_rejections_total[5m])) > 5
        labels:
          severity: warning
        annotations:
          summary: "Bahia dependency-tier rejection rate has spiked"
          runbook_url: "/docs/runbooks/ws6-alerts.md#bahiatierrejectionspike"
      - alert: BahiaOpenClawProvisioningStageStuck
        expr: bahia_openclaw_provisioning_stage_age_seconds{stage!~"running|rolled_back|failed_terminal"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenClaw provisioning run {{ $labels.run_id }} is stuck at {{ $labels.stage }}"
          runbook_url: "/docs/runbooks/openclaw-provisioning-operations.md#incident-and-alert-response"
      - alert: BahiaOpenClawProgressWithoutTerminal
        expr: (bahia_openclaw_provisioning_progress_ratio == 1) and on(instance,build,request_id,run_id,agent_id,stage) (bahia_openclaw_provisioning_terminal_projection == 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OpenClaw provisioning run {{ $labels.run_id }} reached 100% without terminal projection"
          runbook_url: "/docs/runbooks/openclaw-provisioning-operations.md#incident-and-alert-response"
      - alert: BahiaOpenClawFalseRunning
        expr: bahia_openclaw_provisioning_false_running > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpenClaw provisioning run {{ $labels.run_id }} claims running without DM or terminal evidence"
          runbook_url: "/docs/runbooks/openclaw-provisioning-operations.md#incident-and-alert-response"
      - alert: BahiaOpenClawOrphanCandidates
        expr: bahia_openclaw_provisioning_orphan_candidates > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OpenClaw provisioning run {{ $labels.run_id }} has owned resources left after compensation"
          runbook_url: "/docs/runbooks/openclaw-provisioning-operations.md#incident-and-alert-response"
      - alert: BahiaOpenClawRepeatedSignetUnauthorized
        expr: bahia_openclaw_provisioning_signet_unauthorized_responses >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenClaw provisioning run {{ $labels.run_id }} has repeated unauthorized Signet responses"
          runbook_url: "/docs/runbooks/openclaw-provisioning-operations.md#incident-and-alert-response"
      - alert: BahiaOpenClawCorrelationMismatch
        expr: bahia_openclaw_provisioning_correlation_mismatches > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpenClaw provisioning run {{ $labels.run_id }} has resource correlation mismatches"
          runbook_url: "/docs/runbooks/openclaw-provisioning-operations.md#incident-and-alert-response"
      - alert: NodeExporterDown
        expr: up{job="node",expected_state="up"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter is unavailable on {{ $labels.host }}"
          runbook_url: "/docs/runbooks/ws6-alerts.md#nodeexporterdown"
      - alert: HostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.host }} has less than 10% available memory"
          runbook_url: "/docs/runbooks/ws6-alerts.md#hostmemorypressure"
      - alert: HostFilesystemPressure
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.10) and on(instance,device,mountpoint,fstype) node_filesystem_readonly == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.host }} filesystem {{ $labels.mountpoint }} has less than 10% free space"
          runbook_url: "/docs/runbooks/ws6-alerts.md#hostfilesystempressure"
      - alert: LemmyGPUExporterDown
        expr: up{job="nvidia_gpu",host="lemmy"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Lemmy GPU exporter is unavailable"
          runbook_url: "/docs/runbooks/ws6-alerts.md#lemmygpuexporterdown"
      - alert: LemmyGPUMemoryPressure
        expr: nvidia_smi_memory_used_bytes{host="lemmy"} / nvidia_smi_memory_total_bytes{host="lemmy"} > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lemmy GPU {{ $labels.uuid }} has more than 90% VRAM allocated"
          runbook_url: "/docs/runbooks/ws6-alerts.md#lemmygpumemorypressure"
