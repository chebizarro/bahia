global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/bahia-alerts.yml

scrape_configs:
  - job_name: bahia
    metrics_path: /metrics
    static_configs:
      - targets:
          - bahia:8080
        labels:
          environment: edge-01-production
          service: bahia
