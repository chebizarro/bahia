dev_mode: true

nostr:
  # All registered intent domains are enabled unless explicitly listed here.
  intent_domains_disabled: []
  contextvm_relays:
    - "ws://relay:3334/relay"
  sidecar:
    enabled: true
    listen_addr: "0.0.0.0:3334"
    public_url: "ws://localhost:3000/relay"
    backend_url: "ws://relay:3334/relay"
    data_dir: "/var/lib/bahia/relay-sidecar"
    mirror_external: false
    event_retention: 0s # regular events (e.g. 4903 audits) are durable; set a duration to cap them
    request_retention: 24h
    max_query_limit: 2000

reconcile:
  enabled: true
  interval: 60s
