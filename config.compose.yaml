dev_mode: true

nostr:
  contextvm_relays:
    - "ws://relay:3334/relay"
  sidecar:
    enabled: true
    listen_addr: "0.0.0.0:3334"
    public_url: "ws://localhost:3000/relay"
    backend_url: "ws://relay:3334/relay"
    data_dir: "/var/lib/bahia/relay-sidecar"
    mirror_external: false
    event_retention: 168h
    request_retention: 24h
    max_query_limit: 2000

reconcile:
  enabled: true
  interval: 60s
