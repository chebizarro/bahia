server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    set $bahia_forwarded_proto $http_x_forwarded_proto;
    if ($bahia_forwarded_proto = "") {
        set $bahia_forwarded_proto $scheme;
    }

    # Serve the app shell without cache so bootstrap/config changes take effect immediately.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /_app/env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Immutable build assets must never fall through to index.html.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy browser Nostr websocket traffic to the Khatru sidecar relay.
    location /relay {
        proxy_pass http://relay:3334;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bahia_forwarded_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Proxy API requests to bahia backend
    location /api/ {
        proxy_pass http://bahia:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bahia_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
}
