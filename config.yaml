# Bahia configuration example. Omitted fields use internal/config/config.go
# defaults. This file is safe as a starting point only after replacing the key,
# relay, database, and runtime values for the target deployment.
mode: full

dev_mode: false

server:
  # Code defaults: 127.0.0.1:8080, 30s read/write, 15s shutdown.
  host: "127.0.0.1"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 15s

db:
  # PostgreSQL is an optional derived index. The daemon starts without it.
  # Code defaults: localhost:5432, user/name bahia, empty password,
  # sslmode=require, 25 open / 5 idle connections, 5m max lifetime.
  host: localhost
  port: 5432
  user: bahia
  password: ""
  name: bahia
  sslmode: require
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

nostr:
  private_key: ""                 # nsec or 64-hex service key; inject as a secret
  authorized_pubkeys: []           # fleet operator 64-hex pubkeys
  service_relays: []               # daemon publication and backfill
  browser_relays: []               # advertised browser read relays
  contextvm_relays: []             # intents and encrypted interactive RPC
  nip34_relays: []
  publish_enabled: true
  publish_quorum: 1                # -1 requires every configured write relay
  closed_retry_budget: 5
  relay_auth_unavailable: exclude_and_fail
  stale_run_after: 5m
  intent_domains_disabled: []      # every registered domain is enabled by default
  relay_quorum:
    full_min_healthy: 2
    degraded_min_healthy: 1
    emergency_min_healthy: 1
  sidecar:
    enabled: false
    listen_addr: "127.0.0.1:3334"
    public_url: "ws://127.0.0.1:3334"
    backend_url: "ws://127.0.0.1:3334"
    data_dir: "./data/relay-sidecar"
    mirror_external: false
    event_retention: 0s            # regular events remain durable
    request_retention: 24h
    request_retention_kinds: [25910, 1059, 21059]
    max_query_limit: 2000
    subscriber_queue_size: 1024
    negentropy_max_events: 1000000
    read_auth_mode: enforce        # enforce is also the unset/unknown default
    read_auth_allowed_pubkeys: []

reconcile:
  enabled: true
  interval: 60s

runtime:
  type: docker
  docker_host: "unix:///var/run/docker.sock"
  endpoints: {}
  environments: {}

auth:
  enabled: false
  bootstrap_owner_pubkeys: []

adoption:
  enabled: false
  allow_raw_docker_hosts: false
  allow_compose_takeover: false
  allowed_pubkeys: []

direct_runtime_actions:
  enabled: false
  allowed_pubkeys: []

cors:
  allowed_origins: []

oci:
  enabled: false
  spool_dir: /tmp/bahia-oci-spool
  upload_expiry: 24h
  allow_anonymous_pull_cidrs: []
  service_accounts: []

log:
  level: info
  format: json
