# Bahia Deployment Registry - Example Configuration
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 15s

db:
  host: localhost
  port: 5432
  user: bahia
  password: bahia
  name: bahia
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

harbor:
  url: "https://harbor.example.com"
  username: ""
  password: ""
  insecure: false

loom:
  relays:
    - "wss://relay.damus.io"
    - "wss://nos.lol"
  job_timeout: 30m
  poll_interval: 10s

nostr:
  # Locked-down default: empty means the 25910 ContextVM control plane is not enabled.
  # Deployments must inject the operator signer key through secrets/env; never commit it here.
  private_key: ""
  # Backward-compatible alias for service_relays. Do not use this as the public browser relay policy.
  relays:
    - "wss://relay.damus.io"
    - "wss://nos.lol"
  # Backend/service publish and backfill relays. If omitted, nostr.relays is used as a compatibility alias.
  service_relays:
    - "wss://relay.damus.io"
    - "wss://nos.lol"
  # Browser-safe relay endpoints advertised by ContextVM discovery plus NIP-51 kind 30002 only when
  # nostr.sidecar.enabled=true. Use the nginx /relay proxy for the web app.
  browser_relays:
    - "ws://localhost:3000/relay"
  # ContextVM request/reply relays. MVP deployments must configure at least one
  # operator-approved control-plane relay; checked-in defaults are local-only and locked down by publish_enabled=false.
  contextvm_relays:
    - "ws://localhost:3000/relay"
  # Fixed relay AUTH-unavailable behavior: exclude auth-required relays without credentials and fail if quorum is unmet.
  relay_auth_unavailable: "exclude_and_fail"
  # Locked-down default. MVP enablement is a deploy step with a deployment-provided signer key.
  publish_enabled: false
  sidecar:
    enabled: false
    listen_addr: "0.0.0.0:3334"
    public_url: "ws://localhost:3000/relay"
    backend_url: "ws://localhost:3334"
    data_dir: "./data/relay-sidecar"
    mirror_external: false
    event_retention: 168h
    request_retention: 24h
    auth_private_key: ""
    max_query_limit: 500

reconcile:
  interval: 60s
  enabled: true

runtime:
  # Locked-down default: no production runtime endpoint aliases are shipped enabled.
  # MVP btc-01 enablement must register a server-managed endpoint_ref such as
  # runtime.endpoints.btc-01-docker; raw docker_host values must not be sent over Nostr.
  # endpoints:
  #   btc-01-docker:
  #     docker_host: "tcp://btc-01.example.com:2376"
  #     ca_cert_file: "/etc/bahia/docker/btc-01/ca.pem"
  #     client_cert_file: "/etc/bahia/docker/btc-01/cert.pem"
  #     client_key_file: "/etc/bahia/docker/btc-01/key.pem"
  # Legacy flat keys remain supported as the process-wide fallback.
  type: docker
  docker_host: "unix:///var/run/docker.sock"

  # Preferred runtime target defaults. Services use their runtime_type to choose
  # docker, compose, or kubernetes; these fields choose where that runtime runs.
  default:
    type: docker
    docker_host: "unix:///var/run/docker.sock"
    compose_dir: "/srv/bahia/compose/default"
    kube_context: ""
    kube_namespace: "default"
    kube_config: ""

  # Optional per-environment runtime targets. Compose uses one project directory
  # per Bahia environment; all services in that environment share it.
  environments:
    staging:
      compose_dir: "/srv/bahia/compose/staging"
      bahia_owned: false
      docker_host: "unix:///var/run/docker.sock"
    production:
      compose_dir: "/srv/bahia/compose/production"
      bahia_owned: false
      docker_host: "tcp://docker-prod.example.com:2375"

log:
  level: info
  format: json

auth:
  # Locked-down default. MVP deployments enable this and configure operator/agent
  # allowlists (Biz, Stew, and the Bahia signer) outside the committed config.
  # When enabled, protected HTTP routes require NIP-98 Authorization headers.
  enabled: false

adoption:
  # Locked-down default. MVP deployments enable this only with auth.enabled=true,
  # operator pubkey allowlists, and endpoint_ref targets such as btc-01-docker.
  # Privileged adoption scan/import routes are disabled by default.
  # To enable, set auth.enabled=true and configure at least one operator allowlist.
  enabled: false
  # Compose-origin containers are blocked unless operators explicitly accept
  # direct Docker takeover semantics for those workloads.
  allow_compose_takeover: false
  allowed_subjects: []
  allowed_pubkeys: []
  allowed_emails: []

direct_runtime_actions:
  # Locked-down default. MVP deployments enable this only after btc-01 endpoint_ref
  # registration and operator allowlist review.
  # Direct deploy/restart/stop runtime routes are disabled by default.
  # To enable, set auth.enabled=true and configure at least one operator allowlist.
  enabled: false
  allowed_subjects: []
  allowed_pubkeys: []
  allowed_emails: []
