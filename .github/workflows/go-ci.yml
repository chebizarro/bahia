name: Go CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-vet-test:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Architecture ratchet gates
        run: go test ./internal/archtest ./internal/app -run 'TestNoNew|TestArchitecture' -count=1 -v
      - run: go test ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make race
