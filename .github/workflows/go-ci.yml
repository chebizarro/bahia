name: Go CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-vet-test:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install web entrypoint test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gettext-base
      - run: go build ./...
      - run: go vet ./...
      - name: Architecture ratchet gates
        run: go test ./internal/archtest ./internal/app -run 'TestNoNew|TestArchitecture' -count=1 -v
      - run: go test ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install web entrypoint test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gettext-base
      - run: make race
