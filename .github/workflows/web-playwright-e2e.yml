name: Web Playwright E2E

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-playwright-e2e.yml'
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/web-playwright-e2e.yml'

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          package_json_file: web/package.json
          cache: false # setup-node owns the pnpm store cache below.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # relay-harness.js spawns `go run ./cmd/bahia-test-relay` with a 20 s
      # readiness timeout; warm the toolchain, module and build caches first so
      # a cold runner does not spend that budget downloading go1.26 and deps.
      - name: Warm the e2e test relay build
        working-directory: .
        run: go build -o /dev/null ./cmd/bahia-test-relay
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
